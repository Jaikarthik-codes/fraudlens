name: CI

# Runs on every pull request and on pushes to main.
# Checks that the API tests and the dashboard tests pass.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iteration_2_ulb/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: iteration_2_ulb/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iteration_2_ulb/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: iteration_2_ulb/dashboard/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
